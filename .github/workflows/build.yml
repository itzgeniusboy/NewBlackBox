name: Build NewBlackBox AAR & Loader APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-35" "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --install "ndk;29.0.13846066" "ndk;24.0.8215888"
          sdkmanager --install "cmake;3.22.1"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Fix local.properties for CI
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "sdk.dir=$ANDROID_HOME" > NewBlackbox/local.properties

      - name: Build NewBlackBox AAR
        working-directory: NewBlackbox
        run: |
          chmod +x gradlew
          ./gradlew :Bcore:assembleRelease

      - name: Copy AAR to loader libs
        run: cp NewBlackbox/Bcore/build/outputs/aar/Bcore-release.aar app/libs/Bcore-release.aar

      - name: Build Loader APK (debug)
        run: ./gradlew :app:assembleDebug

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bcore-release-aar
          path: NewBlackbox/Bcore/build/outputs/aar/Bcore-release.aar

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: loader-apk-debug
          path: app/build/outputs/apk/debug/app-debug.apk
